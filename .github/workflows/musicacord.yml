# Musicacord: builds the Windows ZIP on every push to main, or on demand
# (Actions > Musicacord > Run workflow), and keeps it as the run's artifact.
# The build is the Windows job of nightly.yml, without the Linux packages or
# the release.
name: Musicacord

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musicacord-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      # The runner's preinstalled SDKs leave too little room for the build.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
      # Skia built for Windows, and the MSVC CRT and SDK it was built against,
      # which nix/prepare-windows-skia.py checks before reusing it.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/cargo-xwin
            .local/windows/skia-static-production/build.json
            .local/windows/skia-static-production/prepared
          key: windows-skia-${{ hashFiles('nix/flake.lock', 'nix/prepare-windows-skia.py', 'nix/prepare-skia-native.py', 'nix/skia-windows-builder/**') }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # Wine doesn't start on the runner, so Inno Setup can't make the
      # installer there: the ZIP only.
      - run: nix develop path:./nix#windows --command scripts/build-windows discord --no-installer
      - uses: actions/upload-artifact@v4
        with:
          name: Musicacord-windows
          path: target/dist/discord/Musicacord-*-windows-x64.zip
          if-no-files-found: error
          compression-level: 0
